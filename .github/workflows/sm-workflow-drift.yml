name: sm-workflow drift

on:
  pull_request:
  merge_group:

jobs:
  sm-workflow-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pack version against the kit
        env:
          GH_TOKEN: ${{ secrets.SM_WORKFLOW_READ_TOKEN }}
          KIT_EVENTS_SECRET: ${{ secrets.KIT_EVENTS_SECRET_KIT }}
        run: |
          # emit: fire-and-forget into the WAFFLE work_events log
          # (WAFFLE-EVENT-SCHEMA.md); never blocks the job; skips when the
          # secret isn't configured.
          emit() {
            [ -n "${KIT_EVENTS_SECRET:-}" ] || { echo "emit: no secret — skipped"; return 0; }
            # -A: Cloudflare's edge bot-mitigation refuses default library
            # user-agents from GitHub Actions IPs before the hub sees the
            # request (TASK-1341). stderr is NOT swallowed: -sS prints the
            # reason, and the previous 2>&1 to /dev/null made every failure
            # here read as an identical undiagnosable line.
            curl -fsS -A "sm-workflow-kit-emit/1 (+https://github.com/sprint-mode/sm-workflow)" -X POST https://webhook-hub.sprintmode.ai/events \
              -H "Authorization: Bearer $KIT_EVENTS_SECRET" -H "Content-Type: application/json" \
              -d "{\"ts\":\"$(date -u +%FT%TZ)\",\"source\":\"kit\",\"event_type\":\"$1\",\"repo\":\"${GITHUB_REPOSITORY##*/}\",\"sha\":\"$GITHUB_SHA\",\"actor\":\"$GITHUB_ACTOR\",\"payload\":$2,\"evidence_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              >/dev/null || echo "::warning::event emit failed (non-blocking)"
          }
          # Versions are semver (N.N.N) with legacy bare-integer stamps meaning
          # N.0.0 (TASK-1384). Adopted repos do not carry the kit's
          # libexec/wf_version.py, so the grammar is inlined here — shell -lt
          # chokes on "13.1.0" and would silently report "current".
          #
          # It is ALMOST the same grammar: TASK-1422 taught the kit's comparator
          # to reject a leading zero ("013" must not parse as 13), and this copy
          # still accepts it. So an adopted repo stamped `013` reads as 13 here,
          # while the kit's own release guard calls it malformed by name and
          # `wf doctor` fails it closed against the floor without ever naming
          # the typo. Tightening a pack template changes fleet behavior on the
          # next `wf sync`, which is outside that item's stored scope — recorded
          # rather than smuggled in.
          # Prints lt|eq|gt; exits nonzero (failing the step) on a malformed value.
          vrel() { python3 -c '
          import sys
          DIGITS = set("0123456789")
          def parse(text):
              parts = text.split(".")
              if len(parts) == 1:
                  parts = [parts[0], "0", "0"]
              if len(parts) != 3 or any(not p or set(p) - DIGITS for p in parts):
                  raise SystemExit(2)
              return tuple(int(p) for p in parts)
          a, b = parse(sys.argv[1]), parse(sys.argv[2])
          print("lt" if a < b else "eq" if a == b else "gt")
          ' "$1" "$2"; }
          RSHORT="${GITHUB_REPOSITORY##*/}"
          # `|| true` guards the diagnostic below against a shell change, and
          # the exact mechanism matters because it is easy to get wrong in both
          # directions. A step with no `shell:` key runs under `bash -e` only,
          # and a pipeline's status is its LAST command's — `cut` succeeds on
          # empty input — so today a missing `version=` reaches the `::error::`
          # and reports itself correctly. Add `shell: bash` (which GitHub runs
          # as `bash -eo pipefail`) and grep's failure starts propagating: the
          # step then dies HERE, silently, and the diagnostic never prints.
          # That is a one-line, innocuous-looking edit away, so pin it rather
          # than rely on the absence of a key. Tested under both shells.
          REPO_V=$(grep '^version=' .sm-workflow.conf | head -1 | cut -d= -f2) || true
          if [ -z "$REPO_V" ]; then echo "::error::.sm-workflow.conf missing version="; exit 1; fi
          # An absent token is a permanent misconfiguration, not an outage, and
          # before BUG-2165 both landed on one conflated fail-open message.
          # Measured 2026-08-17 -- the secret existed on zero of 11 adopted
          # repositories, so this check had never compared a version anywhere
          # while reporting green throughout.
          #
          # The fetch below is still ATTEMPTED with an empty token, on purpose.
          # gh treats an empty GH_TOKEN as absent and falls through to ambient
          # auth (GITHUB_TOKEN, then gh's own config), so on runners with
          # ambient credentials the comparison and its below-floor exit 1 keep
          # binding. A pre-network guard was implemented first and refuted in
          # review for silently disabling exactly that floor (item BUG-2165,
          # 2026-08-18: OLD rc=1 calls=2 vs NEW rc=0 calls=0). Only the MESSAGE
          # branches, on what this run observed: the token it received was
          # empty when the fetch failed. On a same-repo run that means
          # SM_WORKFLOW_READ_TOKEN is not provisioned; fork and Dependabot
          # pull_request runs receive no secrets by design, so there the notice
          # is expected and asserts nothing about repository configuration.
          #
          # Still exit 0 on both arms. Fail-closed is correct and deliberately
          # NOT done here: flipping it before the secret is verified fleet-wide
          # would red every open PR on every adopted repository on their next
          # 'wf sync' -- a fleet outage caused by a safety fix. That step is
          # sequenced behind provisioning, not smuggled in with the diagnostic.
          # Fail-open on fetch errors: a kit outage must never brick the fleet.
          KIT_V=$(gh api repos/sprint-mode/sm-workflow/contents/VERSION --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]') || true
          KIT_MIN=$(gh api repos/sprint-mode/sm-workflow/contents/MIN_VERSION --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]') || true
          if [ -z "${KIT_V:-}" ] || [ -z "${KIT_MIN:-}" ]; then
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::warning::sm-workflow drift check NOT CONFIGURED for this run: the kit VERSION fetch returned nothing and the token this run received was empty, so no version was compared. On a same-repo run this usually means secret SM_WORKFLOW_READ_TOKEN is not available to this run - not provisioned, or scoped to an environment this job does not declare - ask an org admin. Fork and Dependabot pull_request runs receive no Actions secrets by design; there this notice is expected."
              exit 0
            fi
            echo "::warning::Could not fetch kit VERSION (token/network) — drift check skipped."
            exit 0
          fi
          echo "repo=$REPO_V kit=$KIT_V min=$KIT_MIN"
          REL_MIN=$(vrel "$REPO_V" "$KIT_MIN")
          REL_KIT=$(vrel "$REPO_V" "$KIT_V")
          # stamp_version/kit_version are quoted: "13.1.0" is not a JSON number.
          if [ "$REL_MIN" = "lt" ]; then
            emit kit.drift_stamp "{\"repo\":\"$RSHORT\",\"stamp_version\":\"$REPO_V\",\"kit_version\":\"$KIT_V\",\"verdict\":\"below_floor\"}"
            echo "::error::Pack version $REPO_V is below the safety floor $KIT_MIN. Run 'wf sync' and land the update."
            exit 1
          fi
          if [ "$REL_KIT" = "lt" ]; then
            emit kit.drift_stamp "{\"repo\":\"$RSHORT\",\"stamp_version\":\"$REPO_V\",\"kit_version\":\"$KIT_V\",\"verdict\":\"behind\"}"
            echo "::warning::Pack version $REPO_V is behind kit $KIT_V. Run 'wf sync' when convenient."
          else
            emit kit.drift_stamp "{\"repo\":\"$RSHORT\",\"stamp_version\":\"$REPO_V\",\"kit_version\":\"$KIT_V\",\"verdict\":\"current\"}"
          fi
