name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  ci-gate:
    name: ci-gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI gate passed."
