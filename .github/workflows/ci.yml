name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  # PR runs: newest push supersedes (per-ref). Everything else (push to main,
  # merge_group, dispatch): per-SHA so runs are never cancelled by a successor.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Configure git for HTTPS (public deps)
        run: git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - run: npm ci
      - run: npm run lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Configure git for HTTPS (public deps)
        run: git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - run: npm ci
      - run: npm run type-check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: print node version
        run: node --version
      - name: assert node 20
        run: node -e "process.exit(process.version.startsWith('v20')?0:42)"
      - name: Configure git for HTTPS (public deps)
        run: git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - name: npm ci (no cache trust)
        run: npm ci
      - name: build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Configure git for HTTPS (public deps)
        run: git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - run: npm ci
      - run: npm test

  ci-gate:
    name: ci-gate
    needs: [lint, type-check, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job failed or was cancelled ($r)"
              exit 1
            fi
          done
          echo "CI gate passed."
